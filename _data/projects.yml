- name: "Script de instalação de uma versão mínima do Gnome no Debian"
  description: >
    Script para instalação do ambiente de trabalho Gnome na versão mínima no Debian, em que apenas a interface gráfica e alguns pacotes essenciais são instalados.
  image: "assets/img/projects-banner/debian.webp"
  repository: "https://github.com/elainefs/minimal-gnome"
  deploy: "https://github.com/elainefs/minimal-gnome"
  stacks:
    - stack: bash
    - stack: linux

- name: "Tema Jekyll - Case"
  description: >
    Tema Jekyll para Website e Blog pessoal desenvolvido e mantido por mim. O tema é responsivo, com otimização de SEO e outras diversas funcionalidades.
  image: "assets/img/projects-banner/jekyll-theme-case.webp"
  repository: "https://github.com/elainefs/jekyll-theme-case"
  deploy: "http://elaineferreira.com.br/jekyll-theme-case/"
  stacks:
    - stack: javascript
    - stack: html
    - stack: css
    - stack: bootstrap

- name: "Aliment@r"
  description: >
    Plataforma web de doação de alimentos construída durante o Hackathon Reprograme-se 2024. A plataforma é responsiva, com recursos de acessibilidade e salvamento de dados em localStorage.
  image: "assets/img/projects-banner/alimentar.webp"
  repository: "https://github.com/elainefs/alimentar"
  deploy: "https://equipe33-hackathon2024.netlify.app"
  stacks:
    - stack: javascript
    - stack: html
    - stack: css
    - stack: bootstrap

- name: "Sistema de Gerenciamento de Estoque - SGE"
  description: >
    Aplicação FullStack em Django e Django REST Framework para gerenciamento de estoque, com interface web, API RESTful, integração com notificações via CallMeBot (e-mail e WhatsApp) e uso de IA da OpenAI para recomendações sobre produtos.
  image: "assets/img/projects-banner/sge-dashboard.webp"
  repository: "https://github.com/elainefs/django-sge"
  deploy: "https://github.com/elainefs/django-sge"
  stacks:
    - stack: python
    - stack: django
    - stack: postgresql
    - stack: bootstrap
    - stack: docker
