## Project Card Template
# Use the template below to create a new project card
# For each new project, copy the template and fill in the information
# There are two icon packages available, SimpleIcons or Skill Icons (default)
# In 'stack' use the "Brand slug" or "Icon ID' available at:
# SimpleIcons: https://github.com/simple-icons/simple-icons/blob/master/slugs.md
# Skill Icons: https://github.com/tandpfun/skill-icons/tree/main?tab=readme-ov-file#icons-list
